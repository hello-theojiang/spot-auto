name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Le SDK Android est préinstallé sur les runners ubuntu ($ANDROID_HOME).
      - name: SDK Android (platform-35, build-tools 35.0.0)
        working-directory: .
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: openspotauto-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Release (tags uniquement)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: "OpenSpotAuto ${{ github.ref_name }}"
          generate_release_notes: true
